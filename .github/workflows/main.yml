name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip dosyasını aç
        run: unzip -o "*.zip"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        working-directory: SWVideoYukleyici
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp SWVideoYukleyici/app/build/outputs/apk/debug/app-debug.apk SW-Video-Yukleyici.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SW-Video-Yukleyici-APK
          path: SW-Video-Yukleyici.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SW Video Yükleyici v1.0.${{ github.run_number }}
          files: SW-Video-Yukleyici.apk
